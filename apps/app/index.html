 <!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PID Simulator App</title>
  <style>
    :root {
      --bg: #d9dde2;
      --panel: #f4f6f8;
      --panel-strong: #e7ebef;
      --ink: #1b242c;
      --muted: #5b6875;
      --line: #a5b1bd;
      --accent: #e07a2f;
      --accent-2: #2f7a8f;
      --shadow: rgba(35, 47, 58, 0.2);
      --sb-left-w: 280px;
      --sb-right-w: 290px;
      --sb-toggle-w: 28px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(130deg, #f1f3f6 0%, #d1d7de 40%, #eef1f4 100%);
      min-height: 100vh;
    }

    /* ── Three-column layout ── */
    .layout {
      display: flex;
      min-height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* ── Sidebar base ── */
    .sidebar {
      flex-shrink: 0;
      display: flex;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-strong) 100%);
      border: 1px solid var(--line);
      box-shadow: 2px 0 8px var(--shadow);
      overflow: hidden;
      transition: width 220ms ease;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar-inner {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
      transition: opacity 160ms ease;
    }
    .sidebar.collapsed .sidebar-inner { opacity: 0; pointer-events: none; width: 0; padding: 0; }
    .sidebar-toggle {
      flex-shrink: 0;
      width: var(--sb-toggle-w);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--panel-strong);
      border: none;
      font-size: 14px;
      color: var(--muted);
      transition: background 150ms, color 150ms;
      font-family: inherit;
    }
    .sidebar-toggle:hover { background: var(--accent); color: #fff; }

    /* ── Left sidebar ── */
    .sidebar-left { width: var(--sb-left-w); }
    .sidebar-left.collapsed { width: var(--sb-toggle-w); }
    .sidebar-left .sidebar-toggle { order: 2; border-left: 1px solid var(--line); }

    /* ── Right sidebar ── */
    .sidebar-right { width: var(--sb-right-w); box-shadow: -2px 0 8px var(--shadow); }
    .sidebar-right.collapsed { width: var(--sb-toggle-w); }
    .sidebar-right .sidebar-toggle { order: -1; border-right: 1px solid var(--line); }

    /* ── Resize handles ── */
    .resize-handle {
      flex-shrink: 0;
      width: 5px;
      cursor: col-resize;
      background: var(--line);
      transition: background 150ms;
      position: relative;
      z-index: 5;
    }
    .resize-handle::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      left: -4px; right: -4px;
    }
    .resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

    /* ── Sidebar content ── */
    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #24313b;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
    }
    .sidebar-section { display: flex; flex-direction: column; gap: 6px; }
    .sidebar-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-section select,
    .sidebar-section input[type="number"] { width: 100%; }
    .sidebar-divider { height: 1px; background: var(--line); margin: 2px 0; }

    #learnBody {
      white-space: pre-wrap;
      background: #fff;
      border-radius: 6px;
      border: 1px solid var(--line);
      padding: 8px;
      font-size: 12px;
      line-height: 1.5;
      min-height: 60px;
      flex: 1;
    }

    /* ── Info panel ── */
    #infoPanel { display: flex; flex-direction: column; gap: 8px; }
    #infoTitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-2);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    #infoBody {
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--ink);
    }

    /* ── Main content ── */
    .main-content {
      flex: 1;
      min-width: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Shared controls ── */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, select, input[type="number"] {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #eef2f6 100%);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      border-color: #919eac;
      box-shadow: 0 2px 5px var(--shadow);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 8px var(--shadow); }
    #load, #step {
      background: linear-gradient(180deg, #f9bb87 0%, var(--accent) 100%);
      border-color: #bc6320;
      color: #1d1308;
      font-weight: 700;
    }

    /* ── Help button ── */
    .help-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      padding: 0;
      font-size: 8px;
      font-weight: 700;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--muted);
      box-shadow: none;
      cursor: pointer;
      vertical-align: middle;
      margin-left: 3px;
      opacity: 0;
      transition: opacity 150ms, background 120ms, color 120ms, border-color 120ms;
      flex-shrink: 0;
    }
    .field:hover .help-btn { opacity: 0.6; }
    .help-btn:hover { opacity: 1 !important; background: var(--accent-2); color: #fff; border-color: var(--accent-2); transform: none; box-shadow: none; }

    /* ── Parameter grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr));
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-strong) 100%);
    }
    .field { display: flex; flex-direction: column; gap: 4px; transition: opacity 120ms ease; }
    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* ── Chart ── */
    #chartWrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 4px 10px var(--shadow);
    }
    #chart { display: block; width: 100%; height: 280px; }
    .legend { font-size: 13px; margin-top: 6px; color: #2c3a44; }

    /* ── Status ── */
    #status {
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-2);
      background: #edf3f5;
      font-size: 13px;
    }

    /* ── Mode toggle ── */
    .mode-toggle { display: flex; gap: 4px; }
    .mode-btn {
      flex: 1;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      box-shadow: none;
      transition: background 150ms, color 150ms;
    }
    .mode-btn:hover { transform: none; box-shadow: none; background: var(--panel-strong); }
    .mode-btn.active { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }

    .score-display {
      font-size: 12px;
      color: var(--accent-2);
      padding: 4px 8px;
      background: #edf3f5;
      border-radius: 6px;
      border: 1px solid var(--line);
    }

    /* ── Disabled next button ── */
    #nextStep:disabled, #prevStep:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* ── Step rendering ── */
    .step-header { font-weight: 700; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
    .step-num { font-size: 10px; font-weight: 400; color: var(--muted); background: var(--panel-strong); border-radius: 4px; padding: 1px 5px; margin-right: 6px; }
    .step-objective { font-size: 11px; color: var(--accent-2); margin-bottom: 6px; font-style: italic; }
    .step-body { font-size: 12px; line-height: 1.55; color: var(--ink); margin-bottom: 8px; }
    .reflect-block { font-size: 12px; color: var(--muted); background: var(--panel-strong); border-radius: 6px; padding: 6px 8px; margin-top: 6px; border-left: 3px solid var(--line); }

    /* ── Quiz ── */
    .quiz-block { margin-top: 8px; }
    .quiz-question { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .quiz-options { display: flex; flex-direction: column; gap: 4px; }
    .quiz-opt {
      text-align: left;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      cursor: pointer;
      box-shadow: none;
      transition: background 120ms, border-color 120ms;
      white-space: normal;
    }
    .quiz-opt:hover:not(:disabled) { background: #e8f4f8; border-color: var(--accent-2); transform: none; box-shadow: none; }
    .quiz-opt.quiz-correct { background: #d4edda; border-color: #27ae60; color: #155724; }
    .quiz-opt.quiz-wrong { background: #f8d7da; border-color: #e74c3c; color: #721c24; }
    .quiz-opt:disabled { cursor: default; opacity: 0.6; }
    .quiz-feedback { font-size: 11px; margin-top: 6px; padding: 5px 8px; border-radius: 5px; line-height: 1.5; }
    .quiz-feedback.correct { background: #d4edda; color: #155724; border: 1px solid #27ae60; }
    .quiz-feedback.wrong { background: #f8d7da; color: #721c24; border: 1px solid #e74c3c; }

    /* ── Log ── */
    #log {
      white-space: pre;
      background: #eef2f5;
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 8px;
      height: 140px;
      overflow: auto;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12px;
    }

    /* ── Responsive ── */
    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(4, minmax(110px, 1fr)); }
    }
    @media (max-width: 860px) {
      :root { --sb-left-w: 200px; --sb-right-w: 220px; }
      .grid { grid-template-columns: repeat(3, minmax(100px, 1fr)); }
    }
    @media (max-width: 640px) {
      .sidebar-left, .sidebar-right { width: var(--sb-toggle-w) !important; }
      .sidebar-left .sidebar-inner, .sidebar-right .sidebar-inner { opacity: 0; pointer-events: none; width: 0; padding: 0; }
      .grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      button, select, input[type="number"] { width: 100%; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- ══ LEFT SIDEBAR ══ -->
  <aside class="sidebar sidebar-left" id="sidebarLeft">
    <div class="sidebar-inner">
      <div class="sidebar-title">PID Simulator</div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Scenario</div>
        <select id="scenario"></select>
        <button id="load">Ladda scenario</button>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Lärstig</div>
        <select id="learningPath"></select>
        <button id="loadPath">Ladda lärstig</button>
        <div class="mode-toggle">
          <button id="modeGuided" class="mode-btn active">Guidat</button>
          <button id="modeTest" class="mode-btn">Test</button>
        </div>
        <div id="scoreDisplay" style="display:none" class="score-display">Poäng: <strong id="scoreText">0/0</strong></div>
        <div class="row">
          <button id="prevStep">« Föreg.</button>
          <button id="nextStep">Nästa »</button>
        </div>
        <div id="learnBody">Ingen lärstig laddad.</div>
      </div>
    </div>
    <button class="sidebar-toggle" id="toggleLeft" title="Dölj/visa sidebar">«</button>
  </aside>

  <div class="resize-handle" id="resizeLeft"></div>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main-content">
    <div class="row">
      <button id="step">Stega 1</button>
      <button id="run10">Kör 10 steg</button>
      <button id="pulse">Trigga puls</button>
      <button id="reset">Återställ</button>
    </div>

    <div class="grid">
      <div class="field">
        <label for="processType">Processtyp <button class="help-btn" data-help="processType">?</button></label>
        <select id="processType">
          <option value="self_regulating">Självreglerande</option>
          <option value="integrating">Integrerande</option>
        </select>
      </div>
      <div class="field">
        <label for="k"><span id="kLabel">K</span> <button class="help-btn" id="kHelpBtn" data-help="k">?</button></label>
        <input id="k" type="number" step="0.01" min="0.001">
      </div>
      <div class="field">
        <label for="t">T <button class="help-btn" data-help="t">?</button></label>
        <input id="t" type="number" step="0.1" min="1">
      </div>
      <div class="field">
        <label for="l">L <button class="help-btn" data-help="l">?</button></label>
        <input id="l" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="normalValue">Normalvärde <button class="help-btn" data-help="normalValue">?</button></label>
        <input id="normalValue" type="number" step="0.1" min="0" max="100">
      </div>
      <div class="field">
        <label for="outflow">Utflöde <button class="help-btn" data-help="outflow">?</button></label>
        <input id="outflow" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="kp">Kp <button class="help-btn" data-help="kp">?</button></label>
        <input id="kp" type="number" step="0.1" min="0.1">
      </div>
      <div class="field">
        <label for="ti">Ti <button class="help-btn" data-help="ti">?</button></label>
        <input id="ti" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="td">Td <button class="help-btn" data-help="td">?</button></label>
        <input id="td" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="sp">SP <button class="help-btn" data-help="sp">?</button></label>
        <input id="sp" type="number" step="0.1" min="0" max="100">
      </div>
      <div class="field">
        <label for="umin">U min <button class="help-btn" data-help="umin">?</button></label>
        <input id="umin" type="number" step="0.1" min="0" max="100">
      </div>
      <div class="field">
        <label for="umax">U max <button class="help-btn" data-help="umax">?</button></label>
        <input id="umax" type="number" step="0.1" min="0" max="100">
      </div>
      <div class="field">
        <label for="mode">Läge <button class="help-btn" data-help="mode">?</button></label>
        <select id="mode">
          <option value="onoff">OnOff</option>
          <option value="p">P</option>
          <option value="pi">PI</option>
          <option value="pid">PID</option>
          <option value="manual">Manuell</option>
        </select>
      </div>
      <div class="field">
        <label for="bumpless">Bumpless <button class="help-btn" data-help="bumpless">?</button></label>
        <input id="bumpless" type="checkbox" checked title="Mjuk övergång vid lägesbyte">
      </div>
      <div class="field">
        <label for="antiWindup">Anti-windup <button class="help-btn" data-help="antiWindup">?</button></label>
        <input id="antiWindup" type="checkbox" checked title="Förhindra integratoruppvridning vid mättning">
      </div>
      <div class="field">
        <label for="manualOutput">Manuell u <button class="help-btn" data-help="manualOutput">?</button></label>
        <input id="manualOutput" type="number" step="0.1" min="0" max="100">
      </div>
      <div class="field">
        <label for="noise">Brus std <button class="help-btn" data-help="noise">?</button></label>
        <input id="noise" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="pulseMag">Puls mag <button class="help-btn" data-help="pulseMag">?</button></label>
        <input id="pulseMag" type="number" step="0.1">
      </div>
      <div class="field">
        <label for="hysteresLower">Hyst. låg <button class="help-btn" data-help="hysteresLower">?</button></label>
        <input id="hysteresLower" type="number" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="hysteresUpper">Hyst. hög <button class="help-btn" data-help="hysteresUpper">?</button></label>
        <input id="hysteresUpper" type="number" step="0.1" min="0">
      </div>
    </div>

    <div class="row">
      <button id="clearChart">Rensa graf</button>
      <button id="systemReset">Återställ system</button>
    </div>

    <div class="row" id="status">Status: ej laddad</div>

    <div id="chartWrap">
      <canvas id="chart" width="980" height="280"></canvas>
      <div class="legend">Blå: PV &nbsp;&nbsp; Röd streckad: SP &nbsp;&nbsp; Grön: u</div>
    </div>

    <div id="log"></div>
  </main>

  <div class="resize-handle" id="resizeRight"></div>

  <!-- ══ RIGHT SIDEBAR ══ -->
  <aside class="sidebar sidebar-right" id="sidebarRight">
    <button class="sidebar-toggle" id="toggleRight" title="Dölj/visa info">»</button>
    <div class="sidebar-inner">
      <div id="infoPanel">
        <div id="infoTitle" class="sidebar-section-label">Info</div>
        <div id="infoBody">Klicka <strong>?</strong> bredvid ett fält för att se förklaring här.</div>
      </div>
    </div>
  </aside>

</div>
<script src="./app.js"></script>
</body>
</html>
