<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reglerteknik – Interaktivt Lärspel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --surface2: #22263a;
    --border:   #2e3350;
    --text:     #e2e8f0;
    --muted:    #7986a3;
    --accent:   #4f8ef7;
    --green:    #34d399;
    --red:      #f87171;
    --yellow:   #fbbf24;
    --purple:   #a78bfa;
    --orange:   #fb923c;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #topbar h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  #topbar .subtitle { color: var(--muted); font-size: 12px; }

  /* ── SCREENS ── */
  .screen { flex: 1; overflow-y: auto; display: none; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── MENU SCREEN ── */
  #screen-menu {
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px;
    gap: 16px;
  }
  #screen-menu h2 { font-size: 22px; color: var(--text); margin-bottom: 4px; }
  #screen-menu .intro {
    max-width: 680px;
    color: var(--muted);
    line-height: 1.6;
    text-align: center;
    margin-bottom: 8px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 1000px;
  }
  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: border-color .2s, transform .1s;
    position: relative;
  }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .mode-card.locked { opacity: .45; cursor: not-allowed; }
  .mode-card.locked:hover { border-color: var(--border); transform: none; }
  .mode-card .mode-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .mode-card h3 { font-size: 16px; margin: 4px 0 6px; }
  .mode-card p { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .mode-card .difficulty {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 8px;
    font-weight: 600;
  }
  .diff-1 { background: #1d3a2a; color: var(--green); }
  .diff-2 { background: #2a2d1a; color: var(--yellow); }
  .diff-3 { background: #2a1f1a; color: var(--orange); }
  .diff-4 { background: #2a1a1a; color: var(--red); }
  .diff-5 { background: #1e1a2a; color: var(--purple); }
  .mode-stars { position: absolute; top: 14px; right: 14px; font-size: 16px; }
  .lock-icon { position: absolute; top: 14px; right: 14px; font-size: 18px; color: var(--muted); }

  /* ── GAME SCREEN ── */
  #screen-game {
    flex-direction: row;
    overflow: hidden;
  }

  #canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 10px 10px 10px;
    gap: 8px;
    min-width: 0;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #mainCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    border-radius: 8px;
    background: var(--surface);
  }

  #mode-instruction {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    flex-shrink: 0;
  }
  #mode-instruction strong { color: var(--text); }

  /* ── SIDE PANEL ── */
  #side-panel {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    gap: 12px;
  }

  .panel-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .panel-section h4 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 12px;
  }
  .metric-row span:first-child { color: var(--muted); }
  .metric-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .val-good   { color: var(--green); }
  .val-warn   { color: var(--yellow); }
  .val-bad    { color: var(--red); }
  .val-neutral{ color: var(--text); }
  .val-accent { color: var(--accent); }

  .param-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
  }
  .param-row label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .param-row label span { color: var(--text); font-weight: 600; }
  .param-row input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    height: 4px;
    cursor: pointer;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    width: 100%;
    margin-top: 4px;
  }
  .btn:hover { background: var(--border); border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6ba0ff; }
  .btn-danger { background: #5a1a1a; border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: #7a2020; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--surface2); border-color: var(--border); }

  /* preset badges */
  .preset-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .preset-badge {
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
  }
  .preset-badge:hover, .preset-badge.active { border-color: var(--accent); color: var(--accent); background: #1a2040; }

  /* mode 3/4 specific */
  .guess-input {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .guess-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .guess-row label { width: 28px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .guess-row input[type=number] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .guess-row input[type=number]:focus { outline: none; border-color: var(--accent); }

  .process-type-btns { display: flex; flex-direction: column; gap: 5px; }
  .process-type-btn {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    transition: all .15s;
  }
  .process-type-btn:hover { border-color: var(--accent); background: #1a2040; }
  .process-type-btn.correct { border-color: var(--green); background: #1a3020; color: var(--green); }
  .process-type-btn.wrong   { border-color: var(--red); background: #3a1a1a; color: var(--red); }

  /* PID sliders */
  .pid-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .pid-row label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .pid-row label span { color: var(--accent); font-weight: 700; }

  /* score overlay */
  #score-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #score-overlay.visible { display: flex; }
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 36px;
    min-width: 340px;
    text-align: center;
  }
  .score-card h2 { font-size: 22px; margin-bottom: 6px; }
  .score-card .stars-big { font-size: 36px; margin: 12px 0; letter-spacing: 4px; }
  .score-card .final-score { font-size: 42px; font-weight: 800; color: var(--accent); }
  .score-card .score-label { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .score-breakdown { margin: 14px 0; text-align: left; }
  .score-breakdown .sb-row {
    display: flex; justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .score-breakdown .sb-row:last-child { border-bottom: none; }
  .score-card .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .score-card .btn-row .btn { margin-top: 0; }
  .highscore-badge {
    display: inline-block;
    background: #2a2010;
    border: 1px solid var(--yellow);
    color: var(--yellow);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  /* timer bar */
  #timer-bar-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
  }
  #timer-bar { height: 100%; background: var(--accent); width: 100%; transition: width .1s linear; }

  /* notification toast */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    opacity: 0;
    transition: transform .25s, opacity .25s;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* mode 5 controller sim toggle */
  #sim-running-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--green);
  }
  .dot-pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

  #back-btn {
    padding: 6px 14px;
    margin-left: auto;
    width: auto;
  }

  #admin-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    margin-left: 4px;
  }

  #admin-controls label {
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  #admin-controls input[type=checkbox] {
    accent-color: var(--yellow);
    cursor: pointer;
  }

  #admin-badge {
    display: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--yellow);
    border: 1px solid var(--yellow);
    border-radius: 999px;
    padding: 2px 7px;
    background: #2a2010;
  }

  #admin-badge.visible {
    display: inline-block;
  }
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<div id="topbar">
  <h1>⚙ Reglerteknik Lärspel</h1>
  <span class="subtitle">FOPDT Processimulation</span>
  <div id="admin-controls" title="Låser upp alla lägen tillfälligt utan att ändra sparade stjärnor.">
    <label>
      <input type="checkbox" id="admin-toggle">
      Adminläge
    </label>
    <span id="admin-badge">Aktivt</span>
  </div>
  <button class="btn" id="back-btn" style="display:none">← Tillbaka till meny</button>
</div>

<!-- ══════════════════════════════════════════════════
     MENY
══════════════════════════════════════════════════ -->
<div id="screen-menu" class="screen active">
  <h2>Välj spelläge</h2>
  <p class="intro">
    Varje process beter sig som en bilmotor — en <strong>stark motor</strong> kräver försiktigt gaspedal,
    en <strong>svag motor</strong> kräver mer gas. Spela dig igenom lägena för att förstå hur processer,
    tidskonstanter och dödtider påverkar reglering.
  </p>
  <div class="mode-grid" id="mode-grid"></div>
</div>

<!-- ══════════════════════════════════════════════════
     SPELSKÄRM
══════════════════════════════════════════════════ -->
<div id="screen-game" class="screen">
  <div id="canvas-area">
    <div id="canvas-wrap">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div id="mode-instruction"></div>
  </div>
  <div id="side-panel"></div>
</div>

<!-- ── SCORE OVERLAY ── -->
<div id="score-overlay">
  <div class="score-card" id="score-card"></div>
</div>

<!-- ── TOAST ── -->
<div id="toast" id="toast"></div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════
//  CONSTANTS & CONFIG
// ══════════════════════════════════════════════════════════════════

const DT = 0.05;         // fixed simulation timestep [s]
const HIST_LEN = 1200;   // history buffer size (60s @ 20Hz)
const WINDOW_S = 30;     // visible time window [s]
const U_MAX = 100;       // control signal max
const Y_SCALE = 100;     // output display scale

const PRESETS = {
  'Svag motor':   { K: 0.5,  tau: 10, L: 1.0, color: '#7986a3' },
  'Normal motor': { K: 1.5,  tau:  5, L: 1.0, color: '#4f8ef7' },
  'Stark motor':  { K: 4.0,  tau:  3, L: 0.5, color: '#f87171' },
  'Seg process':  { K: 1.0,  tau: 15, L: 3.0, color: '#fbbf24' },
  'Anpassad':     { K: 1.5,  tau:  5, L: 1.0, color: '#a78bfa' },
};

const MODES = [
  {
    id: 1,
    name: 'Stegrespons',
    subtitle: 'Nå börvärdet',
    desc: 'Processparametrar visas. Flytta musen för att styra processen till det röda börvärdet (BV) så snabbt och stabilt som möjligt.',
    difficulty: 1,
    diffLabel: 'Nybörjare',
    requiredStars: 0,
    duration: 45,
  },
  {
    id: 2,
    name: 'Störningsavstötning',
    subtitle: 'Håll börvärdet',
    desc: 'Processen startar på BV men slumpmässiga störningar försöker driva bort den. Håll y så nära BV som möjligt under hela körningen.',
    difficulty: 2,
    diffLabel: 'Medel',
    requiredStars: 2,
    duration: 60,
  },
  {
    id: 3,
    name: 'Identifiera processen',
    subtitle: 'Gissa K, τ och L',
    desc: 'Processparametrar är dolda. Applicera ett steg och analysera responsen. Skatta sedan K, τ och L – hur nära kan du komma?',
    difficulty: 3,
    diffLabel: 'Medel-svår',
    requiredStars: 4,
    duration: null,
  },
  {
    id: 4,
    name: 'Välj processtyp',
    subtitle: 'Självreglerande, integrerande eller instabil?',
    desc: 'Applicera ett steg och observera responsen. Identifiera vilken typ av process det är av de tre alternativen.',
    difficulty: 4,
    diffLabel: 'Svår',
    requiredStars: 6,
    duration: null,
  },
  {
    id: 5,
    name: 'PID-tuning',
    subtitle: 'Ställ in regulatorn',
    desc: 'Processen är känd. Välj Kp, Ki och Kd för din P/PI/PID-regulator. Simulationen kör sedan automatiskt och poängsätter resultatet.',
    difficulty: 5,
    diffLabel: 'Expert',
    requiredStars: 8,
    duration: 60,
  },
];

// ══════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════

const state = {
  activeScreen: 'menu',
  currentMode: null,
  highScores: loadHighScores(),  // { "mode-preset": { score, stars } }
  adminMode: loadAdminMode(),
  totalStars: 0,
};

// Simulation state
const sim = {
  running: false,
  paused:  false,
  t:       0,
  y:       0,
  u:       0,
  setpoint: 60,
  // Params
  K: 1.5, tau: 5, L: 1.0,
  // Internal
  delayBuf: null,
  delayIdx: 0,
  delaySize: 0,
  // History (circular)
  hist:      { t: new Float32Array(HIST_LEN), y: new Float32Array(HIST_LEN), u: new Float32Array(HIST_LEN) },
  histIdx:   0,
  histCount: 0,
  // Metrics
  iae:          0,
  maxY:         0,
  riseTime:     null,
  settleTime:   null,
  settleStart:  null,
  overshoot:    0,
  disturbance:  0,
  disturbTimer: 0,
  // Mode-specific
  modePhase: 'idle',   // idle | running | done
  stepApplied: false,
  pidRunning:  false,
  pidKp: 1.0, pidKi: 0.1, pidKd: 0.0,
  pidIntegral: 0,
  pidPrevError: 0,
  // Mouse
  mouseU: 0,
  mouseOnCanvas: false,
  // Timing
  accumulator: 0,
  lastFrameTime: 0,
  // Mode 4
  processType: 'self',   // 'self' | 'integrating' | 'unstable'
  integratorY: 0,
  answered: false,
  // Countdown before simulation starts
  countdownActive: false,
  countdownRemaining: 0,
};

let countdownOnDone = null;

// ══════════════════════════════════════════════════════════════════
//  LOCALSTORAGE
// ══════════════════════════════════════════════════════════════════

function loadHighScores() {
  try { return JSON.parse(localStorage.getItem('rtSpelScores') || '{}'); }
  catch { return {}; }
}

function loadAdminMode() {
  try { return localStorage.getItem('rtSpelAdminMode') === '1'; }
  catch { return false; }
}

function saveHighScores() {
  localStorage.setItem('rtSpelScores', JSON.stringify(state.highScores));
}

function saveAdminMode() {
  localStorage.setItem('rtSpelAdminMode', state.adminMode ? '1' : '0');
}

function hsKey(modeId, preset) { return `${modeId}-${preset}`; }

function getTotalStars() {
  return Object.values(state.highScores).reduce((s, v) => s + (v.stars || 0), 0);
}

// ══════════════════════════════════════════════════════════════════
//  SIMULATION ENGINE
// ══════════════════════════════════════════════════════════════════

function initDelay(L, dt) {
  const sz = Math.max(1, Math.ceil(L / dt));
  sim.delayBuf  = new Float32Array(sz);
  sim.delayIdx  = 0;
  sim.delaySize = sz;
}

function pushDelay(u) {
  const delayed = sim.delayBuf[sim.delayIdx];
  sim.delayBuf[sim.delayIdx] = u;
  sim.delayIdx = (sim.delayIdx + 1) % sim.delaySize;
  return delayed;
}

function simStep(dt) {
  // Determine control signal
  let u_raw;

  if (sim.pidRunning) {
    // PID controller (mode 5)
    const err = sim.setpoint - sim.y;
    sim.pidIntegral += err * dt;
    sim.pidIntegral = Math.max(-U_MAX * 5, Math.min(U_MAX * 5, sim.pidIntegral));
    const deriv = (err - sim.pidPrevError) / dt;
    sim.pidPrevError = err;
    u_raw = sim.pidKp * err + sim.pidKi * sim.pidIntegral + sim.pidKd * deriv;
  } else {
    u_raw = sim.mouseU;
  }
  sim.u = Math.max(0, Math.min(U_MAX, u_raw));

  // Dead time
  const u_delayed = pushDelay(sim.u);

  // Disturbance (mode 2)
  const d = sim.disturbance;

  // Process dynamics
  if (sim.processType === 'integrating') {
    // Integrating: dy/dt = K * u_delayed
    sim.y += dt * (sim.K * u_delayed + d - 0.05 * sim.y); // slight leak to avoid runaway
  } else if (sim.processType === 'unstable') {
    // Unstable: dy/dt = (K*u - y) / tau but tau < 0
    const tau_un = -Math.abs(sim.tau);
    sim.y += dt * ((sim.K * u_delayed - sim.y) / tau_un + d);
  } else {
    // Self-regulating FOPDT
    sim.y += dt * ((sim.K * u_delayed - sim.y + d * sim.tau) / sim.tau);
  }
  sim.y = Math.max(-20, Math.min(200, sim.y));

  sim.t += dt;

  // Store history
  sim.hist.t[sim.histIdx] = sim.t;
  sim.hist.y[sim.histIdx] = sim.y;
  sim.hist.u[sim.histIdx] = sim.u;
  sim.histIdx = (sim.histIdx + 1) % HIST_LEN;
  if (sim.histCount < HIST_LEN) sim.histCount++;

  // Metrics (only after step applied)
  if (sim.stepApplied) {
    const err = sim.setpoint - sim.y;
    sim.iae += Math.abs(err) * dt;
    if (sim.y > sim.maxY) sim.maxY = sim.y;

    // Rise time: first cross 90% of setpoint from below
    if (sim.riseTime === null && sim.y >= 0.9 * sim.setpoint && sim.setpoint > 0) {
      sim.riseTime = sim.t;
    }

    // Overshoot
    if (sim.setpoint > 0) {
      sim.overshoot = Math.max(0, ((sim.maxY - sim.setpoint) / sim.setpoint) * 100);
    }

    // Settling: sustained ±5% band for 2s
    const band = 0.05 * sim.setpoint;
    if (Math.abs(err) <= band && sim.setpoint > 0) {
      if (sim.settleStart === null) sim.settleStart = sim.t;
      if ((sim.t - sim.settleStart) >= 2.0 && sim.settleTime === null) {
        sim.settleTime = sim.settleStart;
      }
    } else {
      sim.settleStart = null;
    }
  }

  // Disturbance timer (mode 2)
  if (sim.disturbTimer > 0) {
    sim.disturbTimer -= dt;
    if (sim.disturbTimer <= 0) {
      sim.disturbance = 0;
    }
  }
}

function resetSim(K, tau, L, processType) {
  sim.K   = K;
  sim.tau = tau;
  sim.L   = L;
  sim.processType = processType || 'self';
  sim.y   = 0;
  sim.u   = 0;
  sim.t   = 0;
  sim.iae = 0;
  sim.maxY = 0;
  sim.riseTime  = null;
  sim.settleTime = null;
  sim.settleStart = null;
  sim.overshoot = 0;
  sim.disturbance = 0;
  sim.disturbTimer = 0;
  sim.histIdx = 0;
  sim.histCount = 0;
  sim.accumulator = 0;
  sim.stepApplied = false;
  sim.pidRunning  = false;
  sim.pidIntegral = 0;
  sim.pidPrevError = 0;
  sim.modePhase = 'idle';
  sim.answered = false;
  sim.countdownActive = false;
  sim.countdownRemaining = 0;
  countdownOnDone = null;
  initDelay(L, DT);
}

function startCountdown(seconds, onDone) {
  sim.countdownActive = true;
  sim.countdownRemaining = Math.max(0.1, seconds);
  sim.modePhase = 'countdown';
  countdownOnDone = onDone;

  if (!sim.running) {
    sim.running = true;
    sim.lastFrameTime = 0;
    rafId = requestAnimationFrame(gameLoop);
  }
}

// ══════════════════════════════════════════════════════════════════
//  CANVAS RENDERER
// ══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth  * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width  = wrap.clientWidth  + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

function render() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, W, H);

  // Layout
  const PAD_L = 52 * devicePixelRatio;
  const PAD_R = 16 * devicePixelRatio;
  const PAD_T = 16 * devicePixelRatio;
  const PAD_B = 36 * devicePixelRatio;
  const U_STRIP = 0.18 * (H - PAD_T - PAD_B);
  const DIVIDER = PAD_T + (H - PAD_T - PAD_B) * 0.82;

  const plotX = PAD_L;
  const plotY = PAD_T;
  const plotW = W - PAD_L - PAD_R;
  const plotH = DIVIDER - PAD_T;

  const uX = PAD_L;
  const uY = DIVIDER + 4 * devicePixelRatio;
  const uW = plotW;
  const uH = H - DIVIDER - PAD_B - 4 * devicePixelRatio;

  // Y range
  const yMax = Math.max(Y_SCALE * 1.1, sim.setpoint * 1.3, sim.maxY * 1.1, 10);
  const yMin = -5;

  function toCanvasY(y) {
    return plotY + plotH - ((y - yMin) / (yMax - yMin)) * plotH;
  }
  function toCanvasX(t) {
    const tEnd = sim.t;
    const tStart = tEnd - WINDOW_S;
    return plotX + ((t - tStart) / WINDOW_S) * plotW;
  }

  // ── Grid lines
  ctx.strokeStyle = '#1e2235';
  ctx.lineWidth = 1;
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const yv = yMin + (i / yTicks) * (yMax - yMin);
    const cy = toCanvasY(yv);
    ctx.beginPath();
    ctx.moveTo(plotX, cy);
    ctx.lineTo(plotX + plotW, cy);
    ctx.stroke();
  }
  const tEnd = sim.t;
  const tStart = tEnd - WINDOW_S;
  for (let ts = Math.ceil(tStart); ts <= Math.floor(tEnd); ts++) {
    if (ts % 5 === 0) {
      const cx = toCanvasX(ts);
      ctx.beginPath();
      ctx.moveTo(cx, plotY);
      ctx.lineTo(cx, plotY + plotH);
      ctx.stroke();
    }
  }

  // ── Y-axis labels
  ctx.fillStyle = '#7986a3';
  ctx.font = `${10 * devicePixelRatio}px Segoe UI, sans-serif`;
  ctx.textAlign = 'right';
  for (let i = 0; i <= yTicks; i++) {
    const yv = yMin + (i / yTicks) * (yMax - yMin);
    const cy = toCanvasY(yv);
    ctx.fillText(Math.round(yv), plotX - 5 * devicePixelRatio, cy + 4 * devicePixelRatio);
  }
  ctx.textAlign = 'center';
  for (let ts = Math.ceil(tStart / 5) * 5; ts <= tEnd; ts += 5) {
    const cx = toCanvasX(ts);
    ctx.fillText(ts.toFixed(0) + 's', cx, plotY + plotH + 14 * devicePixelRatio);
  }

  // ── Axes
  ctx.strokeStyle = '#2e3350';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.lineTo(plotX + plotW, plotY + plotH);
  ctx.stroke();

  // ── Setpoint line
  const spY = toCanvasY(sim.setpoint);
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 1.5 * devicePixelRatio;
  ctx.setLineDash([8 * devicePixelRatio, 5 * devicePixelRatio]);
  ctx.beginPath();
  ctx.moveTo(plotX, spY);
  ctx.lineTo(plotX + plotW, spY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f87171';
  ctx.font = `bold ${10 * devicePixelRatio}px Segoe UI, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText('BV', plotX + plotW - 24 * devicePixelRatio, spY - 5 * devicePixelRatio);

  // ── 5% settling band
  const band = 0.05 * sim.setpoint;
  if (band > 0) {
    const bandTop = toCanvasY(sim.setpoint + band);
    const bandBot = toCanvasY(sim.setpoint - band);
    ctx.fillStyle = 'rgba(248,113,113,0.06)';
    ctx.fillRect(plotX, bandTop, plotW, bandBot - bandTop);
  }

  // ── History traces
  if (sim.histCount > 1) {
    const n = sim.histCount;
    const start = (sim.histIdx - n + HIST_LEN) % HIST_LEN;

    // Process output y(t)
    ctx.strokeStyle = '#4f8ef7';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    let penDown = false;
    for (let i = 0; i < n; i++) {
      const idx = (start + i) % HIST_LEN;
      const t = sim.hist.t[idx];
      const y = sim.hist.y[idx];
      if (t < tStart) continue;
      const cx = toCanvasX(t);
      const cy = toCanvasY(y);
      if (!penDown) { ctx.moveTo(cx, cy); penDown = true; }
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();

    // Control signal strip (u)
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 1.5 * devicePixelRatio;
    ctx.beginPath();
    penDown = false;
    for (let i = 0; i < n; i++) {
      const idx = (start + i) % HIST_LEN;
      const t = sim.hist.t[idx];
      const u = sim.hist.u[idx];
      if (t < tStart) continue;
      const cx = toCanvasX(t);
      const cy = uY + uH - (u / U_MAX) * uH;
      if (!penDown) { ctx.moveTo(cx, cy); penDown = true; }
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  // ── U strip axis
  ctx.strokeStyle = '#2e3350';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(uX, uY);
  ctx.lineTo(uX, uY + uH);
  ctx.lineTo(uX + uW, uY + uH);
  ctx.stroke();
  ctx.fillStyle = '#7986a3';
  ctx.font = `${9 * devicePixelRatio}px Segoe UI, sans-serif`;
  ctx.textAlign = 'right';
  ctx.fillText('u', uX - 4 * devicePixelRatio, uY + 10 * devicePixelRatio);
  ctx.fillText('100', uX - 4 * devicePixelRatio, uY + 6 * devicePixelRatio);
  ctx.fillText('0',   uX - 4 * devicePixelRatio, uY + uH);

  // ── Current y marker (vertical line at right edge)
  const nowX = toCanvasX(sim.t);
  const nowY = toCanvasY(sim.y);
  if (sim.histCount > 0) {
    ctx.fillStyle = '#4f8ef7';
    ctx.beginPath();
    ctx.arc(nowX, nowY, 4 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Mouse cursor crosshair on canvas
  if (sim.mouseOnCanvas && !sim.pidRunning && sim.modePhase === 'running') {
    const uCy = uY + uH - (sim.mouseU / U_MAX) * uH;
    ctx.strokeStyle = 'rgba(52,211,153,0.35)';
    ctx.lineWidth = 1 * devicePixelRatio;
    ctx.setLineDash([4 * devicePixelRatio, 3 * devicePixelRatio]);
    ctx.beginPath();
    ctx.moveTo(nowX, uY);
    ctx.lineTo(nowX, uCy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#34d399';
    ctx.beginPath();
    ctx.arc(nowX, uCy, 3.5 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Legend
  ctx.font = `${10 * devicePixelRatio}px Segoe UI, sans-serif`;
  ctx.textAlign = 'left';
  const items = [['y(t)', '#4f8ef7'], ['BV', '#f87171'], ['u(t)', '#34d399']];
  let lx = plotX + 8 * devicePixelRatio;
  for (const [label, color] of items) {
    ctx.fillStyle = color;
    ctx.fillRect(lx, plotY + 6 * devicePixelRatio, 14 * devicePixelRatio, 3 * devicePixelRatio);
    ctx.fillStyle = '#7986a3';
    ctx.fillText(label, lx + 18 * devicePixelRatio, plotY + 11 * devicePixelRatio);
    lx += 60 * devicePixelRatio;
  }

  // ── "Idle" / "Väntar" overlay
  if (sim.modePhase === 'idle') {
    ctx.fillStyle = 'rgba(15,17,23,0.6)';
    ctx.fillRect(plotX, plotY, plotW, plotH);
    ctx.fillStyle = '#7986a3';
    ctx.font = `${14 * devicePixelRatio}px Segoe UI, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Tryck på START för att börja', plotX + plotW / 2, plotY + plotH / 2);
  }

  if (sim.countdownActive) {
    const n = Math.max(1, Math.ceil(sim.countdownRemaining));
    ctx.fillStyle = 'rgba(15,17,23,0.65)';
    ctx.fillRect(plotX, plotY, plotW, plotH);
    ctx.fillStyle = '#fbbf24';
    ctx.font = `bold ${56 * devicePixelRatio}px Segoe UI, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(n.toString(), plotX + plotW / 2, plotY + plotH / 2 + 16 * devicePixelRatio);
    ctx.fillStyle = '#7986a3';
    ctx.font = `${14 * devicePixelRatio}px Segoe UI, sans-serif`;
    ctx.fillText('Ställ musen i startposition', plotX + plotW / 2, plotY + plotH / 2 + 52 * devicePixelRatio);
  }

  // ── Settled indicator
  if (sim.settleTime !== null) {
    ctx.fillStyle = 'rgba(52,211,153,0.12)';
    const stX = toCanvasX(sim.settleTime);
    if (stX < plotX + plotW) {
      ctx.fillRect(stX, plotY, plotX + plotW - stX, plotH);
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 1.5 * devicePixelRatio;
      ctx.setLineDash([4 * devicePixelRatio, 3 * devicePixelRatio]);
      ctx.beginPath();
      ctx.moveTo(stX, plotY);
      ctx.lineTo(stX, plotY + plotH);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// ══════════════════════════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════════════════════════

let rafId = null;
let modeTimer = 0;
let modeTimerMax = 0;

function gameLoop(timestamp) {
  if (!sim.running) return;
  rafId = requestAnimationFrame(gameLoop);

  if (sim.lastFrameTime === 0) sim.lastFrameTime = timestamp;
  let delta = (timestamp - sim.lastFrameTime) / 1000;
  sim.lastFrameTime = timestamp;
  delta = Math.min(delta, 0.1); // cap to avoid spiral of death

  sim.accumulator += delta;
  while (sim.accumulator >= DT) {
    if (sim.countdownActive) {
      sim.countdownRemaining -= DT;
      if (sim.countdownRemaining <= 0) {
        sim.countdownActive = false;
        sim.modePhase = 'running';
        if (typeof countdownOnDone === 'function') {
          const fn = countdownOnDone;
          countdownOnDone = null;
          fn();
        }
      }
    } else if (sim.modePhase === 'running') {
      simStep(DT);
      modeTimerStep(DT);
    }
    sim.accumulator -= DT;
  }

  render();
  updateMetricsPanel();
}

function modeTimerStep(dt) {
  if (modeTimerMax === 0) return;
  modeTimer -= dt;
  updateTimerBar();
  if (modeTimer <= 0) {
    endRound();
  }
  // Mode 2: fire random disturbances
  if (state.currentMode === 2 && sim.disturbTimer <= 0) {
    const interval = 8 + Math.random() * 7;
    sim.disturbTimer = 2 + Math.random() * 2;  // disturbance lasts 2–4s
    const amp = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 20);
    sim.disturbance = amp;
    setTimeout(() => {}, 0);
    // schedule next
    const nextDelay = interval;
    // just drive by disturbTimer > 0 in simStep
  }
}

function updateTimerBar() {
  const el = document.getElementById('timer-bar');
  if (!el) return;
  const frac = Math.max(0, modeTimer / modeTimerMax);
  el.style.width = (frac * 100) + '%';
  el.style.background = frac > 0.3 ? 'var(--accent)' : frac > 0.1 ? 'var(--yellow)' : 'var(--red)';
}

// ══════════════════════════════════════════════════════════════════
//  SCORE CALCULATION
// ══════════════════════════════════════════════════════════════════

function calcScore(modeId) {
  let base = 0, breakdown = [];

  if (modeId === 1) {
    // IAE score
    const iaeScore = Math.round(Math.max(0, 100 - sim.iae * 0.3));
    // Overshoot penalty
    const ovPenalty = Math.round(Math.min(30, sim.overshoot * 0.8));
    // Settling bonus
    let settleBonus = 0;
    if (sim.settleTime !== null) {
      const st = sim.settleTime;
      settleBonus = st < 10 ? 20 : st < 20 ? 12 : st < 30 ? 6 : 2;
    }
    base = Math.max(0, iaeScore - ovPenalty + settleBonus);
    breakdown = [
      { label: 'Regleringsfel (IAE)', value: iaeScore + ' p' },
      { label: 'Överskjutning -' + sim.overshoot.toFixed(1) + '%', value: '-' + ovPenalty + ' p' },
      { label: 'Insvängningsbonus', value: '+' + settleBonus + ' p' },
    ];
  }
  else if (modeId === 2) {
    const iaeScore = Math.round(Math.max(0, 100 - sim.iae * 0.15));
    base = iaeScore;
    breakdown = [
      { label: 'Total regleringsavvikelse', value: iaeScore + ' p' },
    ];
  }
  else if (modeId === 3) {
    return null; // handled separately
  }
  else if (modeId === 4) {
    return null; // handled separately
  }
  else if (modeId === 5) {
    const iaeScore = Math.round(Math.max(0, 100 - sim.iae * 0.25));
    const ovPenalty = Math.round(Math.min(25, sim.overshoot * 0.6));
    let settleBonus = 0;
    if (sim.settleTime !== null) {
      const st = sim.settleTime - (sim.riseTime || 0);
      settleBonus = st < 5 ? 20 : st < 15 ? 10 : 4;
    }
    base = Math.max(0, iaeScore - ovPenalty + settleBonus);
    breakdown = [
      { label: 'IAE', value: iaeScore + ' p' },
      { label: 'Överskjutning -' + sim.overshoot.toFixed(1) + '%', value: '-' + ovPenalty + ' p' },
      { label: 'Insvängning', value: '+' + settleBonus + ' p' },
    ];
  }

  base = Math.min(100, Math.max(0, base));
  const stars = base >= 80 ? 3 : base >= 60 ? 2 : base >= 40 ? 1 : 0;
  return { score: base, stars, breakdown };
}

function starsString(n) {
  return '⭐'.repeat(n) + '☆'.repeat(3 - n);
}

//  UI HELPERS

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  state.activeScreen = id;
  document.getElementById('back-btn').style.display = id === 'game' ? '' : 'none';
}

function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function metricClass(val, good, warn) {
  if (val <= good) return 'val-good';
  if (val <= warn) return 'val-warn';
  return 'val-bad';
}

function updateMetricsPanel() {
  const el = document.getElementById('live-metrics');
  if (!el) return;
  const err = (sim.setpoint - sim.y).toFixed(1);
  const errSign = parseFloat(err) >= 0 ? '+' : '';
  el.innerHTML = `
    <div class="metric-row"><span>Processvärde y</span><span class="metric-val val-accent">${sim.y.toFixed(1)}</span></div>
    <div class="metric-row"><span>Börvärde BV</span><span class="metric-val val-neutral">${sim.setpoint.toFixed(0)}</span></div>
    <div class="metric-row"><span>Avvikelse e</span><span class="metric-val ${Math.abs(parseFloat(err)) < 5 ? 'val-good' : 'val-warn'}">${errSign}${err}</span></div>
    <div class="metric-row"><span>Styrsignal u</span><span class="metric-val val-neutral">${sim.u.toFixed(1)}</span></div>
    <div class="metric-row"><span>IAE</span><span class="metric-val ${metricClass(sim.iae, 50, 150)}">${sim.iae.toFixed(1)}</span></div>
    <div class="metric-row"><span>Överskjutning</span><span class="metric-val ${metricClass(sim.overshoot, 5, 20)}">${sim.overshoot.toFixed(1)}%</span></div>
    <div class="metric-row"><span>Insvängningstid</span><span class="metric-val ${sim.settleTime ? 'val-good' : 'val-muted'}">${sim.settleTime ? (sim.settleTime).toFixed(1) + 's' : '—'}</span></div>
    ${modeTimerMax > 0 ? `<div style="margin-top:6px"><div id="timer-bar-wrap"><div id="timer-bar"></div></div><div style="text-align:right;font-size:11px;color:var(--muted);margin-top:2px">${Math.max(0,modeTimer).toFixed(0)}s kvar</div></div>` : ''}
  `;
  updateTimerBar();
}

function refreshHsPanel(modeId) {
  const el = document.getElementById('hs-content');
  if (!el) return;
  const entries = Object.entries(state.highScores)
    .filter(([k]) => k.startsWith(modeId + '-'))
    .sort((a, b) => b[1].score - a[1].score)
    .slice(0, 5);
  if (!entries.length) { el.innerHTML = '<div style="color:var(--muted);font-size:12px">Inga rekord ännu</div>'; return; }
  el.innerHTML = entries.map(([k, v]) => {
    const preset = k.split('-').slice(1).join('-');
    return `<div class="metric-row"><span style="font-size:11px">${preset}</span><span class="metric-val">${starsString(v.stars)} ${v.score}p</span></div>`;
  }).join('');
}

function bindMode1Events() {
  // Preset selection
  document.querySelectorAll('.preset-badge').forEach(b => {
    b.addEventListener('click', () => {
      activePreset = b.dataset.preset;
      buildMode1Panel();
    });
  });

  // Custom sliders

function buildMode3Panel() {
  const panel = document.getElementById('side-panel');

    </div>

      <h4>Rekord</h4>
      <div id="hs-content"></div>
    </div>
  `;
  refreshHsPanel(3);

  // Pick random hidden process
  const keys = ['Svag motor','Normal motor','Stark motor','Seg process'];
  const pick = keys[Math.floor(Math.random() * keys.length)];
  const pp = PRESETS[pick];
  hiddenK   = pp.K   + (Math.random() - 0.5) * pp.K * 0.3;
  hiddenTau = pp.tau + (Math.random() - 0.5) * pp.tau * 0.2;
  hiddenL   = pp.L   + (Math.random() - 0.5) * pp.L * 0.3;
  hiddenK   = Math.max(0.1, +hiddenK.toFixed(2));
  hiddenTau = Math.max(0.5, +hiddenTau.toFixed(1));
  hiddenL   = Math.max(0.05, +hiddenL.toFixed(1));

  resetSim(hiddenK, hiddenTau, hiddenL, 'self');
  sim.setpoint = 0;
  sim.modePhase = 'running';
  sim.running = true;
  sim.lastFrameTime = 0;
  modeTimerMax = 0;
  rafId = requestAnimationFrame(gameLoop);

  document.getElementById('mode-instruction').innerHTML =
    `<strong>Läge 3 – Identifiera processen:</strong> Applicera ett steg med knappen. Avläs slutvärdet (y<sub>∞</sub>), 63%-värdet (y<sub>τ</sub>) och reaktionsfördröjningen (dödtid L) från kurvan. Beräkna K=y<sub>∞</sub>/u, τ och L.`;

  document.getElementById('btn-apply-step').addEventListener('click', () => {
    document.getElementById('btn-apply-step').disabled = true;
    startCountdown(3, () => {
      sim.mouseU = 80;
      sim.stepApplied = true;
      sim.iae = 0;
      sim.maxY = sim.y;
      toast('Steg applicerat: u = 80');
    });
  });

  document.getElementById('btn-reset3').addEventListener('click', () => {
    stopSim();
    buildMode3Panel();
  });

  document.getElementById('btn-submit3').addEventListener('click', submitMode3);
}

function submitMode3() {
  const gK   = parseFloat(document.getElementById('guess-K').value);
  const gTau = parseFloat(document.getElementById('guess-tau').value);
  const gL   = parseFloat(document.getElementById('guess-L').value);

  if (isNaN(gK) || isNaN(gTau) || isNaN(gL)) { toast('Fyll i alla tre fält!'); return; }

  const errK   = Math.abs(gK   - hiddenK)   / hiddenK   * 100;
  const errTau = Math.abs(gTau - hiddenTau) / hiddenTau * 100;
  const errL   = Math.abs(gL   - hiddenL)   / hiddenL   * 100;

  const avgErr = (errK + errTau + errL) / 3;
  const score  = Math.round(Math.max(0, 100 - avgErr * 1.2));
  const stars  = score >= 80 ? 3 : score >= 60 ? 2 : score >= 40 ? 1 : 0;

  stopSim();

  const breakdown = [
    { label: `K: gissade ${gK.toFixed(2)}, sant ${hiddenK.toFixed(2)}`, value: `${errK.toFixed(0)}% fel` },
    { label: `τ: gissade ${gTau.toFixed(1)}s, sant ${hiddenTau.toFixed(1)}s`, value: `${errTau.toFixed(0)}% fel` },
    { label: `L: gissade ${gL.toFixed(1)}s, sant ${hiddenL.toFixed(1)}s`, value: `${errL.toFixed(0)}% fel` },
  ];

  saveScore(3, 'Slumpmässig', score, stars);
  showScoreOverlay(3, score, stars, breakdown);
}

function endRound() {
  sim.modePhase = 'done';
  const result = calcScore(state.currentMode);
  if (!result) return;
  stopSim();
  saveScore(state.currentMode, activePreset, result.score, result.stars);
  showScoreOverlay(state.currentMode, result.score, result.stars, result.breakdown);
}

function stopSim() {
  sim.running = false;
  sim.modePhase = 'done';
  sim.countdownActive = false;
  sim.countdownRemaining = 0;
  countdownOnDone = null;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function saveScore(modeId, preset, score, stars) {
  const key = hsKey(modeId, preset);
  const prev = state.highScores[key];
  if (!prev || score > prev.score) {
    state.highScores[key] = { score, stars };
    saveHighScores();
  }
  state.totalStars = getTotalStars();
}

function showScoreOverlay(modeId, score, stars, breakdown) {
  const overlay = document.getElementById('score-overlay');
  const card = document.getElementById('score-card');
  const modeName = MODES[modeId - 1].name;
  const key = hsKey(modeId, activePreset);
  const prev = state.highScores[key];
  const isNew = prev && prev.score === score;

  card.innerHTML = `
    <h2>${modeName}</h2>
    ${isNew ? '<div class="highscore-badge">★ Nytt rekord!</div>' : ''}
    <div class="stars-big">${starsString(stars)}</div>
    <div class="final-score">${score}</div>
    <div class="score-label">poäng av 100</div>
    <div class="score-breakdown">
      ${breakdown.map(r => `<div class="sb-row"><span>${r.label}</span><span>${r.value}</span></div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">
      Totalt antal stjärnor: <strong>${state.totalStars}</strong> ${buildUnlockHint()}
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-retry">↺ Spela igen</button>
      <button class="btn" id="btn-to-menu">⇦ Meny</button>
    </div>
  `;

  overlay.classList.add('visible');

  document.getElementById('btn-retry').addEventListener('click', () => {
    overlay.classList.remove('visible');
    launchMode(state.currentMode);
  });
  document.getElementById('btn-to-menu').addEventListener('click', () => {
    overlay.classList.remove('visible');
    buildMenu();
    showScreen('menu');
  });
}

function buildUnlockHint() {
  if (state.adminMode) {
    return '— adminläge aktivt: alla lägen är upplåsta tillfälligt';
  }

  for (const m of MODES) {
    if (m.requiredStars > state.totalStars) {
      return `— <span style="color:var(--yellow)">${m.requiredStars - state.totalStars} stjärna(or) till för att låsa upp <em>${m.name}</em></span>`;
    }
  }
  return '— alla lägen upplåsta!';
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const relY = e.clientY - rect.top;
  const frac = Math.max(0, Math.min(1, 1 - relY / rect.height));
  // Low-pass filter (α=0.15) to smooth mouse jitter
  sim.mouseU = sim.mouseU * 0.85 + frac * U_MAX * 0.15;
  sim.mouseOnCanvas = true;
});

canvas.addEventListener('mouseleave', () => { sim.mouseOnCanvas = false; });

function buildMenu() {
  stopSim();
  state.totalStars = getTotalStars();
  const grid = document.getElementById('mode-grid');
  grid.innerHTML = MODES.map(m => {
    const locked = !state.adminMode && state.totalStars < m.requiredStars;
    const key = hsKey(m.id, activePreset);
    const hs = state.highScores[key];
    const starsDisp = hs ? starsString(hs.stars) : '☆☆☆';

    return `
      <div class="mode-card${locked ? ' locked' : ''}" data-mode="${m.id}" ${locked ? '' : 'tabindex="0"'}>
        <div class="mode-num">Läge ${m.id}</div>
        ${locked
          ? '<span class="lock-icon">🔒</span>'
          : `<span class="mode-stars" title="Bästa poäng">${starsDisp}</span>`
        }
        <h3>${m.name}</h3>
        <p>${m.subtitle}</p>
        <p style="margin-top:4px">${m.desc.substring(0, 90)}…</p>
        <span class="difficulty diff-${m.difficulty}">${m.diffLabel}</span>
        ${locked
          ? `<br><span style="font-size:11px;color:var(--muted)">Kräver ${m.requiredStars} ⭐ totalt (du har ${state.totalStars})</span>`
          : (state.adminMode && m.requiredStars > state.totalStars
            ? '<br><span style="font-size:11px;color:var(--yellow)">Upplåst via adminläge</span>'
            : '')}
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.mode-card:not(.locked)').forEach(card => {
    card.addEventListener('click', () => launchMode(+card.dataset.mode));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') launchMode(+card.dataset.mode); });
  });
}

function launchMode(id) {
  state.currentMode = id;
  stopSim();
  showScreen('game');
  resizeCanvas();
  sim.modePhase = 'idle';
  render(); // show idle state immediately

  const builders = {
    1: buildMode1Panel,
    2: buildMode2Panel,
    3: buildMode3Panel,
    4: buildMode4Panel,
    5: buildMode5Panel,
  };
  builders[id]?.();
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
}

function isModeUnlocked(modeId) {
  const mode = MODES.find(m => m.id === modeId);
  if (!mode) return false;
  if (state.adminMode) return true;
  return state.totalStars >= mode.requiredStars;
}

document.addEventListener('keydown', e => {
  if (isTypingTarget(e.target)) return;

  if (state.activeScreen === 'menu' && /^[1-5]$/.test(e.key)) {
    const modeId = parseInt(e.key, 10);
    if (isModeUnlocked(modeId)) {
      e.preventDefault();
      launchMode(modeId);
    }
    return;
  }

  if (state.activeScreen !== 'game') return;

  if (e.key === 'm' || e.key === 'M' || e.key === 'Escape') {
    e.preventDefault();
    stopSim();
    buildMenu();
    showScreen('menu');
    return;
  }

  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    if (state.currentMode) launchMode(state.currentMode);
    return;
  }

  if (e.key === 'n' || e.key === 'N') {
    const btnNewSp = document.getElementById('btn-newsp');
    if (state.currentMode === 1 && btnNewSp && btnNewSp.style.display !== 'none') {
      e.preventDefault();
      btnNewSp.click();
    }
    return;
  }

  if (e.code === 'Space') {
    e.preventDefault();
    const primaryIds = ['btn-start1', 'btn-start2', 'btn-start5', 'btn-apply-step', 'btn-apply-step4'];
    for (const id of primaryIds) {
      const btn = document.getElementById(id);
      if (btn && btn.style.display !== 'none' && !btn.disabled) {
        btn.click();
        return;
      }
    }

    const stopIds = ['btn-stop1', 'btn-stop2', 'btn-stop5'];
    for (const id of stopIds) {
      const btn = document.getElementById(id);
      if (btn && btn.style.display !== 'none' && !btn.disabled) {
        btn.click();
        return;
      }
    }
  }
});

// ══════════════════════════════════════════════════════════════════
//  BACK BUTTON
// ══════════════════════════════════════════════════════════════════

document.getElementById('back-btn').addEventListener('click', () => {
  stopSim();
  buildMenu();
  showScreen('menu');
});

function syncAdminUi() {
  const toggle = document.getElementById('admin-toggle');
  const badge = document.getElementById('admin-badge');
  if (!toggle || !badge) return;
  toggle.checked = state.adminMode;
  badge.classList.toggle('visible', state.adminMode);
}

document.getElementById('admin-toggle').addEventListener('change', e => {
  state.adminMode = !!e.target.checked;
  saveAdminMode();
  syncAdminUi();
  if (state.activeScreen === 'menu') {
    buildMenu();
  }
  toast(state.adminMode
    ? 'Adminläge på: alla lägen upplåsta tillfälligt'
    : 'Adminläge av: normal upplåsning aktiv');
});

// ══════════════════════════════════════════════════════════════════
//  RESIZE HANDLER
// ══════════════════════════════════════════════════════════════════

const ro = new ResizeObserver(() => {
  if (state.activeScreen === 'game') {
    resizeCanvas();
    render();
  }
});
ro.observe(document.getElementById('canvas-wrap'));

// ══════════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════════

state.totalStars = getTotalStars();
syncAdminUi();
buildMenu();

</script>
</body>
</html>
