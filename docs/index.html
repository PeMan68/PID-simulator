<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages – fetch()-test</title>
  <style>
    body { font-family: monospace; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #1a1a2e; color: #e0e0e0; }
    h1 { color: #f0a500; font-size: 1.1rem; margin-bottom: 2rem; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 20px; margin-bottom: 16px; }
    .label { color: #888; font-size: 0.8rem; margin-bottom: 4px; }
    .value { font-size: 1rem; }
    .ok  { color: #4caf50; font-weight: bold; font-size: 1.3rem; }
    .err { color: #f44336; font-weight: bold; font-size: 1.3rem; }
    .url { color: #7eb8f7; font-size: 0.75rem; word-break: break-all; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>PID-simulator – GitHub Pages fetch()-test</h1>
  <div class="card" id="status">
    <div class="label">Status</div>
    <div class="value">Laddar...</div>
  </div>
  <div class="card" id="result" style="display:none">
    <div class="label">Scenario-titel</div>
    <div class="value" id="title"></div>
    <div class="label" style="margin-top:12px">Regulator</div>
    <div class="value" id="mode"></div>
    <div class="label" style="margin-top:12px">Process K / T</div>
    <div class="value" id="process"></div>
    <div class="label" style="margin-top:12px">Börvärde SP</div>
    <div class="value" id="sp"></div>
  </div>
  <div class="card">
    <div class="label">Hämtad URL</div>
    <div class="url" id="fetchUrl"></div>
  </div>

  <script>
    const base = window.location.href.replace(/\/[^/]*$/, '');
    const url  = base + '/content/test-scenario.json';
    document.getElementById('fetchUrl').textContent = url;

    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        document.getElementById('status').innerHTML =
          '<div class="label">Status</div><div class="ok">✓ fetch() fungerar</div>';
        document.getElementById('title').textContent   = data.title;
        document.getElementById('mode').textContent    = data.controller.mode.toUpperCase() + '  (Kp=' + data.controller.kp + ', Ti=' + data.controller.ti + ')';
        document.getElementById('process').textContent = 'K=' + data.process.K + '  T=' + data.process.T;
        document.getElementById('sp').textContent      = data.runtime.setpoint;
        document.getElementById('result').style.display = 'block';
      })
      .catch(err => {
        document.getElementById('status').innerHTML =
          '<div class="label">Status</div><div class="err">✗ Fel: ' + err.message + '</div>' +
          '<div class="label" style="margin-top:8px">Möjlig orsak</div>' +
          '<div class="value">Appen körs lokalt (file://) — fetch() kräver HTTP. Öppna via GitHub Pages URL istället.</div>';
      });
  </script>
</body>
</html>
